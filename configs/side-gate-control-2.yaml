esphome:
  name: side-gate-control-2
  friendly_name: Side Gate Control 2
  min_version: 2026.7.0
  
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

globals:
  - id: wifi_reconnect_count
    type: int
    restore_value: no
    initial_value: '0'

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password
    type: digest

# Allow Over-The-Air updates
ota:
- platform: esphome
  password: !secret otapw

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_wifi_password
  on_connect:
    then:
      - lambda: |-
          id(wifi_reconnect_count)++;
          id(reconnect_sensor).publish_state(id(wifi_reconnect_count));

captive_portal:

button:
  - platform: restart
    name: Restart

debug:
  update_interval: 30s

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset Reason
  - platform: version
    name: ESPHome Version
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    bssid:
      name: "Connected BSSID"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: wifi_signal
    name: "WiFi Signal %"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 60s
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
  - platform: template
    name: "WiFi Reconnect Count"
    id: reconnect_sensor
    unit_of_measurement: "reconnects"
    icon: "mdi:wifi-refresh"
    accuracy_decimals: 0
  - platform: uptime
    name: Uptime
    icon: mdi:clock-start
  - platform: internal_temperature
    name: "Internal Temperature"

switch:
  - platform: gpio
    pin: GPIO16
    id: relay
    name: "Gate Remote"
    icon: "mdi:gate"
    on_turn_on:
    - delay: 500ms
    - switch.turn_off: relay

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
    name: Button
    filters:
      - invert
      - delayed_on_off: 50ms
    on_press:
      then:
        - switch.turn_on: relay

status_led:
  pin:
    number: GPIO23
    inverted: true
