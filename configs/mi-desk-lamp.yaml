substitutions:
  name: mi-desk-lamp
  friendly_name: "Mi Desk Lamp 1S"
  device_description: "Xiaomi Mi Desk Lamp 1S (MJTD01SYL / Mango1S ESP32)"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${device_description}
  min_version: 2026.10.0
  project:
    name: "yeelight.mango1s-esp32"
    version: "1.0.0"
  on_boot:
    # Restore remembered light settings, show the startup indication, then leave OFF.
    priority: -100.0
    then:
      - lambda: |-
          // A zero brightness cannot produce a visible startup blink. Raise it
          // to the minimum (5%) so the lamp still gives its boot indication.
          if (id(saved_brightness) < 0.05f) {
            id(saved_brightness) = 0.05f;
          }
          if (id(saved_color_temp) <= 0.0f) {
            id(saved_color_temp) = 300.0f;
          }
          ESP_LOGI("restore", "Loaded brightness %.0f%%, color temperature %.0f mireds",
                   id(saved_brightness) * 100.0f, id(saved_color_temp));
      - logger.log: "Boot: Starting initial 2x flash indication..."
      - repeat:
          count: 2
          then:
            - light.turn_on:
                id: light1
                brightness: !lambda 'return id(saved_brightness);'
                color_temperature: !lambda 'return id(saved_color_temp);'
                transition_length: 0s
            - delay: 350ms
            - light.turn_off:
                id: light1
                transition_length: 0s
            - delay: 200ms
      - logger.log: "Boot: Initial flash sequence finished. Lamp is OFF."

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
    advanced:
      # Fix for Xiaomi/Yeelight devices with custom MAC addresses burned into eFuses
      ignore_efuse_mac_crc: true
      ignore_efuse_custom_mac: true

# ==============================================================================
# WIFI AND CONNECTIVITY CONFIGURATION
# ==============================================================================
# PHASE 1 (Development / Debugging):
#   - Keep 'enable_on_boot: true' and configure your home network credentials.
#
# PHASE 2 (Standalone / Offline mode):
#   - Set 'enable_on_boot: false'.
#   - On power-up, WiFi remains completely OFF.
#   - Triple-click the knob button to turn ON the Access Point ("Mi-Desk-Lamp-AP").
#   - Triple-click again to turn WiFi back OFF.
#   - (Optional) Comment out 'ssid' and 'password' below if no STA is desired.
# ==============================================================================
wifi:
  # Home WiFi credentials (commented out for standalone AP-only Phase 2)
  # ssid: !secret wifi_ssid
  # password: !secret wifi_password
  # min_auth_mode: WPA2

  # WiFi is OFF on boot. Activated on-demand via triple-click.
  enable_on_boot: false

  # Prevent device from rebooting when WiFi is unavailable
  reboot_timeout: 0s

  # On-demand Access Point (AP) mode
  ap:
    ssid: "Mi-Desk-Lamp-AP"
    password: "Mango1S!"

# Embedded web server for standalone control via browser (http://192.168.4.1 in AP mode)
web_server:
  port: 80
  version: 3
  local: true

# captive_portal disabled: it redirects to WiFi scan page instead of the control web UI.
# After connecting to "Mi-Desk-Lamp-AP", open http://192.168.4.1/ manually.

ota:
  - platform: esphome
  - platform: web_server

logger:
  level: DEBUG

# Flush changed preferences to ESP32 NVS at most once per minute.
preferences:
  flash_write_interval: 1min

# ==============================================================================
# DIAGNOSTICS & SYSTEM SENSORS
# ==============================================================================
text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: false

# ==============================================================================
# WEB CONTROLS - EXPLICIT COLOR TEMPERATURE SLIDER
# ==============================================================================
number:
  - platform: template
    name: "Brightness (%)"
    id: brightness_slider
    icon: "mdi:brightness-6"
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 1
    mode: slider
    update_interval: 1s
    set_action:
      - logger.log:
          format: "Web slider: Setting brightness to %.0f%%"
          args: ['x']
      - lambda: 'id(saved_brightness) = x / 100.0f;'
      - if:
          condition:
            lambda: 'return id(light1).remote_values.is_on();'
          then:
            - light.turn_on:
                id: light1
                brightness: !lambda 'return x / 100.0f;'
    lambda: |-
      return id(saved_brightness) * 100.0f;

  - platform: template
    name: "Color Temperature"
    id: color_temp_slider
    icon: "mdi:thermometer"
    unit_of_measurement: "K"
    min_value: 2500
    max_value: 4800
    step: 50
    mode: slider
    update_interval: 1s
    set_action:
      - logger.log:
          format: "Web slider: Setting color temperature to %.0f K"
          args: ['x']
      - lambda: 'id(saved_color_temp) = 1000000.0f / x;'
      - if:
          condition:
            lambda: 'return id(light1).remote_values.is_on();'
          then:
            - light.turn_on:
                id: light1
                color_temperature: !lambda 'return 1000000.0 / x;'
    lambda: |-
      float mireds = id(saved_color_temp);
      if (mireds > 0.0f) {
        return 1000000.0f / mireds;
      }
      return 3500.0f;

# ==============================================================================
# PERSISTED LIGHT SETTINGS AND TEMPORARY BLINK STATE
# ==============================================================================
globals:
  - id: saved_brightness
    type: float
    restore_value: yes
    initial_value: '0.05'
  - id: saved_color_temp
    type: float
    restore_value: yes
    initial_value: '300.0'
  - id: blink_brightness
    type: float
    initial_value: '1.0'
  - id: blink_color_temp
    type: float
    initial_value: '300.0'
  - id: blink_light_on
    type: bool
    initial_value: 'false'

# ==============================================================================
# SCRIPTS - reusable blink-down feedback (visible even when lamp is ON)
# ==============================================================================
script:
  - id: blink_once
    # Blink feedback regardless of lamp state:
    #   Lamp ON  → blink-down: turn off 200ms, then restore
    #   Lamp OFF → blink-up:   turn on briefly at the remembered brightness, then turn off
    mode: single
    then:
      - lambda: |-
          id(blink_brightness) = id(light1).remote_values.get_brightness();
          id(blink_color_temp) = id(light1).remote_values.get_color_temperature();
          id(blink_light_on) = id(light1).remote_values.is_on();
      - if:
          condition:
            lambda: 'return id(blink_light_on);'
          then:
            # Lamp is ON → blink-down: turn off briefly, then restore
            - light.turn_off:
                id: light1
                transition_length: 0s
            - delay: 200ms
            - light.turn_on:
                id: light1
                brightness: !lambda 'return id(blink_brightness);'
                color_temperature: !lambda 'return id(blink_color_temp);'
                transition_length: 0s
          else:
            # Lamp is OFF → blink-up at the remembered brightness/color temperature, then turn off.
            - light.turn_on:
                id: light1
                brightness: !lambda 'return (id(saved_brightness) > 0.0f) ? id(saved_brightness) : 0.05f;'
                color_temperature: !lambda 'return (id(saved_color_temp) > 0.0f) ? id(saved_color_temp) : 300.0f;'
                transition_length: 0s
            - delay: 200ms
            - light.turn_off:
                id: light1
                transition_length: 0s

# Keep an on/off control in the web UI while the brightness percentage slider
# below replaces the native light control (which exposes brightness as 0-255).
switch:
  - platform: template
    name: "${friendly_name} Power"
    lambda: 'return id(light1).remote_values.is_on();'
    turn_on_action:
      - logger.log:
          format: "Web UI: Light ON, brightness %.0f%%, color temperature %.0f K"
          args: ['id(saved_brightness) * 100.0f', '1000000.0f / id(saved_color_temp)']
      - light.turn_on:
          id: light1
          brightness: !lambda 'return id(saved_brightness);'
          color_temperature: !lambda 'return id(saved_color_temp);'
    turn_off_action:
      - logger.log:
          format: "Web UI: Light OFF, brightness %.0f%%, color temperature %.0f K"
          args: ['id(saved_brightness) * 100.0f', '1000000.0f / id(saved_color_temp)']
      - light.turn_off:
          id: light1

# ==============================================================================
# HARDWARE INPUTS - BUTTON AND ROTARY ENCODER
# ==============================================================================
binary_sensor:
  - platform: gpio
    id: button
    name: "Knob Button"
    internal: true
    pin:
      number: GPIO33
      inverted: true
      mode: INPUT_PULLDOWN
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      # 1. TRIPLE-CLICK: Toggle WiFi ON/OFF (AP mode access)
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.4s
          - ON for at most 0.4s
          - OFF for at most 0.4s
          - ON for at most 0.4s
          - OFF for at least 0.3s
        then:
          - logger.log: "Triple-click detected: Toggling WiFi state!"
          - if:
              condition:
                wifi.enabled:
              then:
                - wifi.disable:
                - logger.log: "WiFi disabled."
                # 1 blink-down feedback on disable
                - script.execute: blink_once
              else:
                - wifi.enable:
                - logger.log: "WiFi enabled (AP mode)."
                # 3 blink-down flashes feedback on enable
                - script.execute: blink_once
                - delay: 450ms
                - script.execute: blink_once
                - delay: 450ms
                - script.execute: blink_once

      # 2. SINGLE-CLICK: Toggle lamp light ON/OFF
      - timing:
          - ON for at most 0.5s
          - OFF for at least 0.35s
        then:
          - lambda: |-
              bool turn_on = !id(light1).remote_values.is_on();
              float brightness = id(saved_brightness) * 100.0f;
              float color_temp = id(saved_color_temp);
              float color_temp_kelvin = color_temp > 0.0f ? 1000000.0f / color_temp : 0.0f;
              ESP_LOGD("knob", "Knob Button: Light %s, brightness %.0f%%, color temperature %.0f K",
                       turn_on ? "ON" : "OFF", brightness, color_temp_kelvin);
          - if:
              condition:
                lambda: 'return !id(light1).remote_values.is_on();'
              then:
                - light.turn_on:
                    id: light1
                    brightness: !lambda 'return id(saved_brightness);'
                    color_temperature: !lambda 'return id(saved_color_temp);'
                    transition_length: 0.2s
              else:
                - light.turn_off:
                    id: light1
                    transition_length: 0.2s

sensor:
  - platform: rotary_encoder
    id: rotation
    name: "Knob Rotation"
    internal: true
    pin_a: GPIO27
    pin_b: GPIO26
    resolution: 2
    on_value:
      then:
        - if:
            condition:
              # Ignore wheel movement while the lamp is OFF. The button's
              # multi-click handler remains active for the WiFi toggle.
              lambda: 'return x != 0 && id(light1).remote_values.is_on();'
            then:
              - if:
                  condition:
                    # Button pressed while rotating -> adjust color temperature (CWWW)
                    lambda: 'return id(button).state;'
                  then:
                    - lambda: |-
                        float min_mireds = id(light1).get_traits().get_min_mireds();
                        float max_mireds = id(light1).get_traits().get_max_mireds();
                        float cur_mireds = id(light1).current_values.get_color_temperature();
                        float min_kelvin = 1000000.0f / max_mireds;
                        float max_kelvin = 1000000.0f / min_mireds;
                        float cur_kelvin = 1000000.0f / cur_mireds;
                        float new_kelvin = max(min_kelvin, min(max_kelvin, cur_kelvin + (x * 115.0f)));
                        float new_temp = 1000000.0f / new_kelvin;
                        id(saved_color_temp) = new_temp;
                        auto call = id(light1).turn_on();
                        call.set_color_temperature(new_temp);
                        call.perform();
                        ESP_LOGD("knob", "Knob Turn (Pressed): Color Temperature = %.0f K (%.1f mireds)", new_kelvin, new_temp);
                  else:
                    # Button not pressed -> adjust brightness
                    - lambda: |-
                        float cur_b = id(light1).current_values.get_brightness();
                        float new_b = max(0.05f, min(1.0f, cur_b + (x / 20.0f)));
                        id(saved_brightness) = new_b;
                        auto call = id(light1).turn_on();
                        call.set_brightness(new_b);
                        call.perform();
                        ESP_LOGD("knob", "Knob Turn: Brightness = %.0f%% (delta %+.0f%%)", new_b * 100.0f, (x / 20.0f) * 100.0f);
        # Reset relative rotation counter to 0
        - sensor.rotary_encoder.set_value:
            id: rotation
            value: 0

# ==============================================================================
# POWER SUPPLY AND PWM OUTPUTS (LEDC)
# ==============================================================================
# GPIO12 enables the LED step-down DC/DC converter rail (mandatory on 1S hardware)
power_supply:
  - id: power
    pin: GPIO12
    enable_time: 0s
    keep_on_time: 0s

output:
  # Cold White LED PWM (40 kHz prevents audible inductor whine)
  - platform: ledc
    pin: GPIO2
    id: output_cw
    frequency: 40000Hz
    power_supply: power

  # Warm White LED PWM (40 kHz prevents audible inductor whine)
  - platform: ledc
    pin: GPIO4
    id: output_ww
    frequency: 40000Hz
    power_supply: power

# ==============================================================================
# LIGHT COMPONENT (Cold White / Warm White)
# ==============================================================================
light:
  - platform: cwww
    id: light1
    name: "${friendly_name} Light"
    default_transition_length: 0s
    constant_brightness: true
    cold_white: output_cw
    warm_white: output_ww
    cold_white_color_temperature: 4800K
    warm_white_color_temperature: 2500K
    restore_state: none
    gamma_correct: 0
    internal: true
