esphome:
  name: swimming-pool-pump
  friendly_name: swimming-pool-pump
  min_version: 2026.7.0

esp8266:
  board: esp12e

globals:
  - id: was_running
    type: bool
    restore_value: no
    initial_value: 'false'

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password
    type: digest

# Allow Over-The-Air updates
ota:
- platform: esphome
  password: !secret otapw

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_disconnect:
    then:
      - lambda: |-
          id(was_running) = id(relay).state;
      - switch.turn_off: relay
  on_connect:
    then:
      - lambda: |-
          if (id(was_running)) {
            id(relay).turn_on();
          }

captive_portal:

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: Uptime
    icon: mdi:clock-start

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    name: "Button"
    on_press:
      - switch.toggle: relay
  - platform: status
    name: "Status"
  
switch:
  - platform: gpio
    name: "Relay"
    pin: GPIO5
    id: relay

status_led:
  pin:
    number: GPIO2
    inverted: true
