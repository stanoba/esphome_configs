esphome:
  name: swimming-pool-pump
  friendly_name: swimming-pool-pump
  min_version: 2026.7.0
  platformio_options:
    lib_ldf_mode: deep+
  libraries:
    - "AsyncPing=https://github.com/akaJes/AsyncPing.git"

esp8266:
  board: esp12e

external_components:
  - source:
      type: git
      url: https://github.com/trombik/esphome-component-ping
      ref: main

globals:
  - id: wifi_reconnect_count
    type: int
    restore_value: no
    initial_value: '0'

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password
    type: digest

# Allow Over-The-Air updates
ota:
- platform: esphome
  password: !secret otapw

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    then:
      - lambda: |-
          id(wifi_reconnect_count)++;
          id(reconnect_sensor).publish_state(id(wifi_reconnect_count));

captive_portal:

button:
  - platform: restart
    name: Restart

debug:
  update_interval: 30s

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset Reason
  - platform: version
    name: ESPHome Version
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    bssid:
      name: "Connected BSSID"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: wifi_signal
    name: "WiFi Signal %"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 60s
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
  - platform: ping
    ip_address: 192.168.5.1
    latency:
      name: "Gateway Ping Latency"
    loss:
      name: "Gateway Ping Packet Loss"
    update_interval: 60s
    timeout: 1s
  - platform: template
    name: "WiFi Reconnect Count"
    id: reconnect_sensor
    unit_of_measurement: "reconnects"
    icon: "mdi:wifi-refresh"
    accuracy_decimals: 0
  - platform: uptime
    name: Uptime
    icon: mdi:clock-start

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    name: "Button"
    on_press:
      - switch.toggle: relay
  - platform: status
    name: "Status"
  
switch:
  - platform: gpio
    name: "Relay"
    pin: GPIO5
    id: relay
    restore_mode: RESTORE_DEFAULT_OFF

status_led:
  pin:
    number: GPIO2
    inverted: true
