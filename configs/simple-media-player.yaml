substitutions:
  device_name: simple-media-player
  friendly_name: "ESP32 Media Player 1"
  led_brightness: 25%
  led_gpio_pin: GPIO48
  sample_rate: 48000

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.0
  on_boot:
    priority: 800
    then:
      - output.turn_on: dac_unmute
      - light.turn_on:
          id: onboard_led
          brightness: ${led_brightness}
          red: 0%
          green: 10%
          blue: 20%

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    advanced:
      flash_chip: boya
    sdkconfig_options:
      CONFIG_BT_ENABLED: "n"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_LWIP_TCP_WND_DEFAULT: "65535"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "64"
      CONFIG_LWIP_UDP_RECVMBOX_SIZE: "64"
      CONFIG_LWIP_TCPIP_RECVMBOX_SIZE: "64"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret otapw

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
#  output_power: 8.5dB
#  power_save_mode: NONE
  ap:
    ssid: "Simple-Media-Player-AP"
    password: !secret ap_wifi_password

captive_portal:

web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password
    type: digest

# Soft-Mute control (Pin 3 XSMT on PCM5102A) via GPIO 10
output:
  - platform: gpio
    pin: GPIO10
    id: dac_unmute

# 3.5mm Headphone Jack insertion detection via GPIO 14
# BOOT button (GPIO 0) doubles as Play/Pause during normal operation
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: false
    name: "Headphones Connected"
    id: headphone_jack_detect
    on_press:
      then:
        - logger.log: "Audio jack connected - unmuting DAC"
        - output.turn_on: dac_unmute
    on_release:
      then:
        - logger.log: "Audio jack disconnected - stopping playback"
        - media_player.stop: simple_player
        - output.turn_off: dac_unmute

  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    name: "Play-Pause Button"
    id: boot_button
    on_click:
      then:
        - if:
            condition:
              media_player.is_playing: simple_player
            then:
              - media_player.pause: simple_player
            else:
              - media_player.play: simple_player

# I2S Audio Bus
i2s_audio:
  - id: i2s_bus
    i2s_bclk_pin: GPIO8
    i2s_lrclk_pin: GPIO17

# Physical I2S Speaker (PCM5102A external stereo DAC)
speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO18
    sample_rate: $sample_rate
    bits_per_sample: 16bit
    buffer_duration: 500ms
    timeout: never
    dac_type: external
    channel: stereo

  # Dual-Pipeline Audio Mixer (Allows concurrent Music + TTS/Announcements)
  - platform: mixer
    id: audio_mixer
    output_speaker: i2s_speaker
    source_speakers:
      - id: announcement_speaker
      - id: media_speaker

# Network Media Player with 512 kB buffer in PSRAM for seamless streaming (Music Assistant)
media_player:
  - platform: speaker
    id: simple_player
    name: "Media Player"
    announcement_pipeline:
      speaker: announcement_speaker
    media_pipeline:
      speaker: media_speaker
    buffer_size: 524288
    task_stack_in_psram: true
    volume_increment: 0.02
    volume_initial: 0.80
    volume_min: 0.04
    volume_max: 0.96
    on_play:
      then:
        - output.turn_on: dac_unmute
        - light.turn_on:
            id: onboard_led
            brightness: ${led_brightness}
            red: 0%
            green: 80%
            blue: 0%
    on_idle:
      then:
        - light.turn_on:
            id: onboard_led
            brightness: ${led_brightness}
            red: 0%
            green: 10%
            blue: 20%
    on_pause:
      then:
        - light.turn_on:
            id: onboard_led
            brightness: ${led_brightness}
            red: 30%
            green: 30%
            blue: 0%

# Onboard RGB LED on ESP32-S3 (GPIO 38)
light:
  - platform: esp32_rmt_led_strip
    id: onboard_led
    name: "Status LED"
    pin: ${led_gpio_pin}
    num_leds: 1
    channel_colors: GRB
    chipset: ws2812
    default_transition_length: 300ms
    restore_mode: RESTORE_DEFAULT_ON
