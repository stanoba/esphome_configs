esphome:
  name: greenhouse
  friendly_name: 'Greenhouse sensors'
  min_version: 2026.7.0
  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(deep_sleep_control).set_sleep_duration(id(sleep_duration_ms));
      - if:
          condition:
            binary_sensor.is_on: deep_sleep_prevented
          then:
            - deep_sleep.prevent: deep_sleep_control

esp8266:
  board: d1_mini

# Persistent global variables
globals:
  - id: prevent_deep_sleep_virtual_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: sleep_duration_ms
    type: uint32_t
    restore_value: yes
    initial_value: '1200000' # Default 20 minutes (in milliseconds)

# Enable logging
logger: {}

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password
    type: digest

# Allow Over-The-Air updates
ota:
  - platform: esphome
    password: !secret otapw

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_wifi_password

captive_portal: {}

# Standard Wemos D1 Mini Pro status LED
status_led:
  pin:
    number: GPIO2
    inverted: true

# I2C Bus matching ESPEasy settings (400kHz speed)
i2c:
  sda: GPIO4
  scl: GPIO5
  frequency: 400khz
  scan: true

# Select dropdown in HA to choose deep sleep duration
select:
  - platform: template
    name: "Sleep Duration"
    id: sleep_duration_select
    icon: mdi:timer-sand
    optimistic: true
    restore_value: true
    entity_category: config
    options:
      - "5 min"
      - "10 min"
      - "20 min"
    initial_option: "20 min"
    on_value:
      then:
        - lambda: |-
            if (x == "5 min") {
              id(sleep_duration_ms) = 300000;
            } else if (x == "10 min") {
              id(sleep_duration_ms) = 600000;
            } else {
              id(sleep_duration_ms) = 1200000;
            }
            id(deep_sleep_control).set_sleep_duration(id(sleep_duration_ms));

# Interconnected Virtual Switch to prevent deep sleep from HA
switch:
  - platform: template
    name: "Prevent Deep Sleep"
    id: prevent_deep_sleep_virtual
    icon: mdi:sleep-off
    lambda: |-
      return id(stay_awake_jumper).state || id(prevent_deep_sleep_virtual_state);
    turn_on_action:
      then:
        - globals.set:
            id: prevent_deep_sleep_virtual_state
            value: 'true'
        - lambda: |-
            id(prevent_deep_sleep_virtual).publish_state(true);
            id(deep_sleep_prevented).publish_state(true);
    turn_off_action:
      then:
        - globals.set:
            id: prevent_deep_sleep_virtual_state
            value: 'false'
        - lambda: |-
            bool state = id(stay_awake_jumper).state;
            id(prevent_deep_sleep_virtual).publish_state(state);
            id(deep_sleep_prevented).publish_state(state);

# Binary Sensors (Stay Awake Jumper & Door Sensor)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO12 # Pin D6
      mode: INPUT_PULLUP
    name: "Door Sensor"
    device_class: door
    id: door_sensor

  - platform: gpio
    pin:
      number: GPIO13 # Pin D7
      mode: INPUT_PULLUP
      inverted: true
    name: "Stay Awake Jumper"
    id: stay_awake_jumper
    entity_category: diagnostic
    on_state:
      then:
        - lambda: |-
            bool state = id(stay_awake_jumper).state || id(prevent_deep_sleep_virtual_state);
            id(prevent_deep_sleep_virtual).publish_state(state);
            id(deep_sleep_prevented).publish_state(state);

  # Combined sleep prevention template
  - platform: template
    name: "Deep Sleep Prevented"
    id: deep_sleep_prevented
    entity_category: diagnostic
    lambda: |-
      return id(prevent_deep_sleep_virtual).state;
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: deep_sleep_prevented
            then:
              - deep_sleep.prevent: deep_sleep_control
            else:
              - deep_sleep.allow: deep_sleep_control

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: Uptime
    icon: mdi:clock-start

  # HTU21D Environment Sensor (Task 3)
  - platform: htu21d
    temperature:
      name: "Temperature"
      id: temp1_temp
    humidity:
      name: "Humidity"
      id: temp1_humidity
    update_interval: 45s

  # INA219 Energy DC Sensor (Task 4)
  - platform: ina219
    address: 0x41
    shunt_resistance: 0.1 ohm
    current:
      name: "Current"
      id: current_current
      unit_of_measurement: "mA"
      accuracy_decimals: 1
      filters:
        - multiply: 1000.0
    power:
      name: "Power"
      id: current_power
    bus_voltage:
      name: "Voltage"
      id: current_voltage
    update_interval: 30s

  # Translated Rule: Battery Percentage
  - platform: template
    name: "Battery Percent"
    id: battery_percent
    unit_of_measurement: "%"
    icon: mdi:battery
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      float voltage = id(current_voltage).state;
      if (std::isnan(voltage)) return {};
      float percent = (voltage - 3.0f) / 0.012f;
      if (percent < 0.0f) percent = 0.0f;
      if (percent > 100.0f) percent = 100.0f;
      return percent;

# Deep Sleep Cycle (Dynamically overridden on boot / select via C++ functions)
# Note: Ensure GPIO16 (D0) is wired to the RST pin for wakeups to function.
deep_sleep:
  id: deep_sleep_control
  sleep_duration: 20min
  run_duration: 61s
